# Local development stack.
#
#   docker compose up --build
#     client   -> http://localhost:8080
#     backend  -> http://localhost:5000
#
# Put real secrets in backend/.env (gitignored); this file only sets the wiring
# between containers plus safe development defaults.

services:
  # ── MongoDB ─────────────────────────────────────────────────────────────────
  # Runs as a SINGLE-NODE REPLICA SET on purpose. placeOrder uses
  # session.withTransaction(), which requires a replica set — a standalone mongod
  # would silently exercise the non-transactional fallback locally and hide
  # concurrency bugs that would then only appear in production.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once the
      # node has become PRIMARY.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # ── Redis (optional — the app degrades gracefully without it) ───────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── API ─────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      # directConnection is required to talk to a single-node replica set by host.
      MONGODB_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      FRONTEND_URL: http://localhost:8080
      BACKEND_URL: http://localhost:5000
      # Development-only placeholders. Override in backend/.env for real integrations.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-32c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-32c}
      # config/stripe.ts throws at import time without this, so the API cannot boot.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_local_placeholder}
    env_file:
      # Optional — real keys land here and override the defaults above.
      - path: ./backend/.env
        required: false
    restart: unless-stopped

  # ── Web ─────────────────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      args:
        # Left empty by default: with no valid key the checkout disables card
        # payment instead of showing a bypass. Set a real pk_… to test Stripe.
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        # No VITE_STORE_ID: the tenant is resolved at runtime from the hostname.
        # On localhost every host is the platform, so reach a storefront at
        # /s/<slug>, or set VITE_DEV_STORE_SLUG for a dev build that serves one
        # store at the root.
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
