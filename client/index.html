<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vendbase — A multi-tenant SaaS platform empowering vendors to build and manage their e-commerce storefronts effortlessly." />
    <title>Vendbase</title>
    <!-- Preconnect to third-party image origins to reduce connection setup time -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <!-- Preload the first hero carousel image — it is the LCP element on the homepage.
         Moving its fetch to the earliest possible moment (HTML parse time) rather than
         waiting for JS to execute significantly reduces Largest Contentful Paint. -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1595665593673-bf1ad72905c0?q=80&w=1328&auto=format&fit=crop&fm=webp&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
